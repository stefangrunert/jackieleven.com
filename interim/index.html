<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="An independent tribute to Jackie Leven is taking shape here. Music, stories and his own words.">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="canonical" href="https://jackieleven.com/">
  <title>Jackie Leven · An independent tribute</title>
  <style>
    @font-face { font-family: Newsreader; src: url('/assets/fonts/newsreader-normal.woff2') format('woff2'); font-style: normal; font-weight: 300 400; font-display: swap; }
    @font-face { font-family: 'Space Grotesk'; src: url('/assets/fonts/space-grotesk-normal.woff2') format('woff2'); font-style: normal; font-weight: 400 500; font-display: swap; }
    :root { color-scheme: dark; --bg: #0b0b0c; --ink: #ecebe6; --ink-dim: #8a919b; --ink-soft: #b9bdc4; --line: #2a2a2c; --accent: #d4a24e; background: var(--bg); color: var(--ink); font-family: Newsreader, Georgia, serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; }
    header { padding: 2rem clamp(1.5rem, 5vw, 5rem); color: var(--ink-dim); font-family: 'Space Grotesk', sans-serif; font-size: .7rem; letter-spacing: .08em; }
    main { width: min(100% - 3rem, 43rem); margin: auto; padding: 3rem 0 4rem; text-align: center; }
    .years { font-family: 'Space Grotesk', sans-serif; font-size: .75rem; letter-spacing: .22em; color: var(--accent); }
    h1 { margin: 1.5rem 0 2rem; font-weight: 300; font-size: clamp(4rem, 12vw, 7.5rem); letter-spacing: -.055em; line-height: .95; }
    p { font-size: clamp(1.2rem, 2.6vw, 1.5rem); line-height: 1.5; text-wrap: pretty; }
    .intro { max-width: 34rem; margin: 0 auto; }
    @media (max-width: 420px) { header { padding-top: 1.5rem; } main { padding-top: 2rem; } h1 { font-size: 4.5rem; } }
  </style>
</head>
<body>
  <header>jackieleven.com</header>
  <main>
    <div class="years">1950–2011</div>
    <h1>Jackie Leven</h1>
    <p class="intro">An independent tribute is taking shape here.<br>
      A place for his music, his stories and his own words.</p>
  </main>
</body>
</html>
