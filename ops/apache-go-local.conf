# Include only inside the MAMP jackieleven virtual host.
# HTTPS terminates at MAMP; the Go backend is loopback-only.
ProxyRequests Off
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
ProxyPass "/" "http://127.0.0.1:8080/" connectiontimeout=5 timeout=45
ProxyPassReverse "/" "http://127.0.0.1:8080/"
<Location "/">
    Require local
</Location>
