# Bootstrap vhost, used until the first certificate has been issued.
server {
    listen 80;
    listen [::]:80;
    server_name jackieleven.com www.jackieleven.com;
    root /var/www/jackieleven/current;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ =404; }
}
