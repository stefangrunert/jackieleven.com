server {
    listen 80;
    listen [::]:80;
    server_name jackieleven.com www.jackieleven.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://jackieleven.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jackieleven.com;
    ssl_certificate /etc/letsencrypt/live/jackieleven.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jackieleven.com/privkey.pem;
    return 301 https://jackieleven.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jackieleven.com;
    ssl_certificate /etc/letsencrypt/live/jackieleven.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jackieleven.com/privkey.pem;
    root /var/www/jackieleven/current;
    index index.html;
    autoindex off;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ =404; }
}
