# http context; names belong exclusively to this preview.
limit_req_zone $binary_remote_addr zone=jackie_preview_pages:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=jackie_preview_connections:1m;
map $request_uri $jackie_preview_contact_key {
    default "";
    ~^/jackieleven/+(de|en)/+(mitmachen|contribute)(/|\?|$) $binary_remote_addr;
}
limit_req_zone $jackie_preview_contact_key zone=jackie_preview_contact:1m rate=10r/m;

# Query strings and referrers deliberately excluded from search access logs.
log_format jackie_search_private '$time_iso8601 $request_method $uri $status $body_bytes_sent';
map $arg_q $jackie_preview_search_key {
    "" "";
    default $binary_remote_addr;
}
map $arg_q $jackie_preview_search_global_key {
    "" "";
    default jackie_search;
}
limit_req_zone $jackie_preview_search_key zone=jackie_preview_search:1m rate=12r/m;
limit_req_zone $jackie_preview_search_global_key zone=jackie_preview_search_global:1m rate=60r/m;
