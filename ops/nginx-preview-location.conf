# Only included in the HTTPS unpubli.sh server block.
location = /jackieleven {
    return 302 /jackieleven/$is_args$args;
}
location ^~ /jackieleven/ {
    include /etc/nginx/snippets/jackieleven-preview-realip.conf;
    client_max_body_size 128k;
    limit_req zone=jackie_preview_pages burst=40 nodelay;
    limit_req zone=jackie_preview_contact burst=5 nodelay;
    limit_req_status 429;
    limit_conn jackie_preview_connections 10;
    limit_conn_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://www.youtube.com/iframe_api https://www.youtube.com/s/player/ https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.nb.no https://i.ytimg.com https://is1-ssl.mzstatic.com https://f4.bcbits.com https://www.mig-music.de; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; frame-src https://challenges.cloudflare.com https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    proxy_pass http://127.0.0.1:18766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    proxy_intercept_errors off;
    proxy_hide_header X-Robots-Tag;
}

