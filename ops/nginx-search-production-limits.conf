# Production-only search limits. Query text, referrers and IPs are not logged.
log_format jackie_production_search_private '$time_iso8601 $request_method $uri $status $body_bytes_sent';
map $uri $jackie_production_search_key {
    default "";
    ~^/(de/suche|en/search)/?$ $binary_remote_addr;
}
map $uri $jackie_production_search_global_key {
    default "";
    ~^/(de/suche|en/search)/?$ jackie_production_search;
}
map $uri $jackie_production_referrer {
    default strict-origin-when-cross-origin;
    ~^/(de/suche|en/search) no-referrer;
}
limit_req_zone $jackie_production_search_key zone=jackie_production_search:1m rate=12r/m;
limit_req_zone $jackie_production_search_global_key zone=jackie_production_search_global:1m rate=60r/m;
