# Included only in jackieleven.com's HTTPS server; inherit its security headers.
location ^~ /de/suche {
    access_log /var/log/nginx/jackieleven-search-production.log jackie_production_search_private;
    error_log /dev/null crit;
    limit_req zone=jackie_production_search burst=8 nodelay;
    limit_req zone=jackie_production_search_global burst=12 nodelay;
    limit_req_status 429;
    limit_conn jackie_connections 10;
    limit_conn_status 429;
    proxy_hide_header Referrer-Policy;
    proxy_pass http://127.0.0.1:18765;
    include /etc/nginx/jackieleven-go-proxy.conf;
}
location ^~ /en/search {
    access_log /var/log/nginx/jackieleven-search-production.log jackie_production_search_private;
    error_log /dev/null crit;
    limit_req zone=jackie_production_search burst=8 nodelay;
    limit_req zone=jackie_production_search_global burst=12 nodelay;
    limit_req_status 429;
    limit_conn jackie_connections 10;
    limit_conn_status 429;
    proxy_hide_header Referrer-Policy;
    proxy_pass http://127.0.0.1:18765;
    include /etc/nginx/jackieleven-go-proxy.conf;
}
location = /de/suche-test { return 404; }
location = /en/search-test { return 404; }
