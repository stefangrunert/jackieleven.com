# Included in nginx's http context; all variable/zone names are site-specific.
# Check the TCP peer, not the visitor IP restored from CF-Connecting-IP.
geo $realip_remote_addr $jackie_origin_allowed {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
    @CLOUDFLARE_NETWORKS@
}

# index.php is the only PHP entry point. All other locations skip these limits.
limit_req_zone $binary_remote_addr zone=jackie_pages:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=jackie_connections:1m;
map $request_uri $jackie_contact_key {
    default "";
    ~^/+(de|en)/+(mitmachen|contribute)(/|\?|$) $binary_remote_addr;
}
limit_req_zone $jackie_contact_key zone=jackie_contact:1m rate=10r/m;
