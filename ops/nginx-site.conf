# PHP website: install separately when the full site is ready to go live.
# Confirm the PHP-FPM socket and configure API keys in PHP-FPM's environment.
server {
    listen 80;
    listen [::]:80;
    server_name jackieleven.com www.jackieleven.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://jackieleven.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jackieleven.com;
    ssl_certificate /etc/letsencrypt/live/jackieleven.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jackieleven.com/privkey.pem;
    return 301 https://jackieleven.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jackieleven.com;
    ssl_certificate /etc/letsencrypt/live/jackieleven.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jackieleven.com/privkey.pem;
    root /var/www/jackieleven/site-current/public;
    index index.php;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ~ /\. { return 404; }
    location = /index.php {
        include fastcgi_params;
        # Resolve the release link so OPcache does not reuse the previous release.
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php(?:/|$) { return 404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.php$is_args$args; }
}
