# Only this vhost uses the origin gate and limits from jackieleven-security.conf.
server {
    listen 80;
    listen [::]:80;
    server_name jackieleven.com www.jackieleven.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }
    location / {
        if ($jackie_origin_allowed = 0) { return 403; }
        return 301 https://jackieleven.com$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jackieleven.com;
    if ($jackie_origin_allowed = 0) { return 403; }
    ssl_certificate /etc/letsencrypt/live/jackieleven.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jackieleven.com/privkey.pem;
    return 301 https://jackieleven.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jackieleven.com;
    if ($jackie_origin_allowed = 0) { return 403; }
    ssl_certificate /etc/letsencrypt/live/jackieleven.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jackieleven.com/privkey.pem;
    root /var/www/jackieleven/site-current/public;
    include /etc/nginx/jackieleven-cloudflare.conf;
    index index.php;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://www.youtube.com/iframe_api https://www.youtube.com/s/player/ https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.nb.no https://i.ytimg.com https://is1-ssl.mzstatic.com https://f4.bcbits.com https://www.mig-music.de; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; frame-src https://challenges.cloudflare.com https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # 10,000 four-byte characters may occupy 120 KB when form-URL-encoded.
    client_max_body_size 128k;
    location ~ /\. { return 404; }
    location = /index.php {
        # The original URI survives try_files' internal redirect to index.php.
        limit_req zone=jackie_pages burst=30 nodelay;
        limit_req zone=jackie_contact burst=5 nodelay;
        limit_req_status 429;
        limit_conn jackie_connections 10;
        limit_conn_status 429;
        include fastcgi_params;
        # Resolve the release link so OPcache does not reuse the previous release.
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/jackieleven.sock;
    }
    location ~ \.php(?:/|$) { return 404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.php$is_args$args; }
}
