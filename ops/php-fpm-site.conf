[jackieleven]
user = jackieleven
group = jackieleven
listen = /run/php/jackieleven.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 20s
pm.max_requests = 500
clear_env = yes
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 128M
php_admin_value[session.save_path] = /var/lib/jackieleven/sessions
env[JACKIE_CONTACT_STATE_DIR] = /var/lib/jackieleven/contact
env[JACKIE_RESEND_API_KEY] = @RESEND_API_KEY@
